<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SOL · 太阳系</title>
    <!-- Critical first-paint styles must not wait for the JavaScript module graph. -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000308; color: #e9f0ff; }
      [hidden] { display: none !important; }
      #app { position: fixed; inset: 0; }
      body.booting #app > :not(#loading) { visibility: hidden !important; }
      #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #000308; }
      #loading p { font: 11px/1.8 system-ui, sans-serif; letter-spacing: .3em; color: #a3a8b8; text-align: center; padding: 0 24px; }
      .loader { width: 34px; height: 34px; border: 1px solid #ffd9a02e; border-top-color: #ffd9a0; border-radius: 50%; animation: startup-spin 1.1s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
    </style>
    <meta name="description" content="一颗恒星，八颗行星，以及它们之间漫长的沉默。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd9a0'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4' fill='none' stroke='%23ffd9a0' stroke-opacity='.5'/%3E%3C/svg%3E"
    />
  </head>
  <body class="booting">
    <div id="app">
      <div id="scene"></div>
      <div id="labels"></div>

      <div id="vignette"></div>

      <header id="brand">
        <h1>SOL<span class="brand-dot"></span></h1>
        <p>与宇宙，片刻相逢</p>
      </header>
      <div id="observation"><span>NOW OBSERVING</span><strong id="observation-name">太阳系</strong><i></i></div>
      <a id="credits" href="./textures/ATTRIBUTION.md" target="_blank" rel="noopener">影像 · Solar System Scope / CC BY 4.0</a>

      <div id="timebar" class="glass">
        <div class="date" id="date">—</div>
        <div class="row">
          <button id="play" class="icon" title="暂停 / 继续">❚❚</button>
          <input id="speed" aria-label="时间速度" type="range" min="0" max="7" step="1" value="2" />
          <span id="speedlabel" class="speedlabel">1秒 = 1小时</span>
        </div>
        <div class="row">
          <button id="now" class="ghost">回到今天</button>
          <input id="scrub" aria-label="年份时间轴（1800–2050）" type="range" min="-200" max="50" step="0.01" value="0" />
        </div>
      </div>

      <div id="hud" class="glass">
        <div class="hrow">
          <label for="size">天体尺寸</label>
          <input id="size" type="range" min="0" max="100" step="1" value="100" />
        </div>
        <div class="hrow" id="sizerow">
          <span class="tag" data-size="1">视觉夸张</span>
          <span class="tag" data-size="0">真实比例</span>
        </div>
        <div class="hrow toggles">
          <button id="toggle-orbits" class="toggle on">轨道线</button>
          <button id="toggle-labels" class="toggle on">标签</button>
          <button id="toggle-trails" class="toggle on">轨迹</button>
        </div>
      </div>

      <aside id="panel" class="glass" hidden>
        <button id="close" class="close" aria-label="关闭">×</button>
        <div class="pname">
          <h2 id="p-title">地球</h2>
          <span id="p-latin">TERRA</span>
        </div>
        <p id="p-poetry" class="poetry">—</p>
        <div id="p-views" class="view-presets"><button data-view="oblique">近距离</button><button data-view="top">俯视</button><button data-view="edge">侧视</button><button data-view="ring">环面</button><button data-view="system">卫星系统</button></div>
        <div id="p-related" class="related"></div>
        <details><summary>观测档案 / 物理数据</summary><dl id="p-data"></dl></details>
        <button id="p-follow" class="follow">跟随它</button>
      </aside>

      <nav id="quickbar"></nav>

      <div id="intro">
        <div class="intro-inner">
          <h1 class="big">SOL</h1>
          <p class="sub">在漫长的宇宙里，与你共享这一刻</p>
          <button id="skip-intro" type="button">进入星空 <span aria-hidden="true">→</span></button>
        </div>
      </div>

      <div id="loading">
        <div class="loader"></div>
        <p>正在点亮恒星…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
